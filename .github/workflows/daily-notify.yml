name: Daily notify

on:
  schedule:
    # GitHub chạy theo lịch thường TRỄ (có khi vài tiếng). Lần thứ hai chỉ là dự phòng,
    # thiết bị nào đã nhận trong ngày sẽ được bỏ qua (không gửi trùng).
    - cron: '40 0 * * *'    # 07:40 giờ Việt Nam
    - cron: '10 1 * * *'    # 08:10 giờ Việt Nam
  workflow_dispatch:         # bấm "Run workflow" để chạy thử thủ công (luôn gửi)

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
        working-directory: scripts
      - name: Gửi thông báo
        run: node notify.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://tiendz1.github.io/Chromatech/
