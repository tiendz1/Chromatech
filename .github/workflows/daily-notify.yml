name: Daily notify

on:
  schedule:
    # GitHub hay chạy TRỄ 10-30 phút, nên hẹn sớm hơn 8h và có một lần dự phòng.
    # Lần dự phòng tự bỏ qua nếu thiết bị đã nhận thông báo trong ngày.
    - cron: '40 0 * * *'    # 00:40 UTC = 07:40 sáng giờ Việt Nam
    - cron: '10 1 * * *'    # 01:10 UTC = 08:10 sáng giờ Việt Nam (dự phòng)
  workflow_dispatch:         # cho phép bấm "Run workflow" để chạy thử thủ công

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
        working-directory: scripts
      - name: Gửi thông báo
        run: node notify.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://tiendz1.github.io/fresh-track/
